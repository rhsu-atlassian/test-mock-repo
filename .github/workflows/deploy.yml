name: Deploy

on:
  # Run only after CI succeeds on main (chained workflow)
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        type: choice
        options:
          - test
          - staging
          - production
        required: true
      dry-run:
        description: 'Dry-run mode (no actual deploy)'
        type: boolean
        default: false

# Guard: every job must verify CI passed (for workflow_run) or it's a manual dispatch
jobs:
  # Build all deployable packages in a single ordered job (project references handle dep graph)
  build-deployables:
    name: Build Deployables
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - name: Build all packages (ordered via tsc -b)
        run: npx tsc -b
      - name: Upload build artifacts (api-server)
        uses: actions/upload-artifact@v4
        with:
          name: deploy-api-server
          path: packages/api-server/dist
          retention-days: 1
      - name: Upload build artifacts (worker)
        uses: actions/upload-artifact@v4
        with:
          name: deploy-worker
          path: packages/worker/dist
          retention-days: 1
      - name: Upload build artifacts (web)
        uses: actions/upload-artifact@v4
        with:
          name: deploy-web
          path: packages/web/dist
          retention-days: 1

  deploy-test:
    name: Deploy to Test
    needs: [build-deployables]
    if: |
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'test')
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        if: ${{ !inputs.dry-run }}
        run: echo "Deploying api-server, worker, web to TEST"
      - name: Dry-run notice
        if: ${{ inputs.dry-run }}
        run: echo "[dry-run] Would deploy to test"

  deploy-staging:
    name: Deploy to Staging
    needs: [deploy-test]
    if: |
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "Deployed to staging"

  smoke-tests:
    name: Smoke Tests (Staging)
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - name: Run smoke tests
        working-directory: .
        run: echo "smoke tests would run here"

  deploy-production:
    name: Deploy to Production
    needs: [smoke-tests]
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip-deploy]')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Deployed to production"
