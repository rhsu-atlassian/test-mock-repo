name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-integration:
        description: 'Run integration tests'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Stage 1: Build all packages (single job, uses project references for dep order) ----------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - name: Build all packages (ordered via tsc -b)
        run: npx tsc -b
      - name: Upload build artifacts (types)
        uses: actions/upload-artifact@v4
        with:
          name: build-types
          path: packages/types/dist
          retention-days: 1
      - name: Upload build artifacts (core)
        uses: actions/upload-artifact@v4
        with:
          name: build-core
          path: packages/core/dist
          retention-days: 1
      - name: Upload build artifacts (client)
        uses: actions/upload-artifact@v4
        with:
          name: build-client
          path: packages/client/dist
          retention-days: 1
      - name: Upload build artifacts (api-server)
        uses: actions/upload-artifact@v4
        with:
          name: build-api-server
          path: packages/api-server/dist
          retention-days: 1
      - name: Upload build artifacts (worker)
        uses: actions/upload-artifact@v4
        with:
          name: build-worker
          path: packages/worker/dist
          retention-days: 1
      - name: Upload build artifacts (web)
        uses: actions/upload-artifact@v4
        with:
          name: build-web
          path: packages/web/dist
          retention-days: 1

  # ---------- Stage 2: Lint (runs after build so dist/ exists for type-checking) ----------
  lint:
    name: Lint
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - name: Download build artifacts (types)
        uses: actions/download-artifact@v4
        with:
          name: build-types
          path: packages/types/dist
      - name: Download build artifacts (core)
        uses: actions/download-artifact@v4
        with:
          name: build-core
          path: packages/core/dist
      - name: Download build artifacts (client)
        uses: actions/download-artifact@v4
        with:
          name: build-client
          path: packages/client/dist
      - name: Run ESLint
        working-directory: .
        run: npm run lint

  # ---------- Stage 3: Unit tests (matrix across packages × node versions) ----------
  test-unit:
    name: Unit Tests
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        package: [api-server, worker]
        node-version: ['18', '20', '22']
        exclude:
          - package: api-server
            node-version: '18'
    uses: ./.github/workflows/reusable-test.yml
    with:
      package: ${{ matrix.package }}
      node-version: ${{ matrix.node-version }}

  # ---------- Stage 4: Integration tests (conditional) ----------
  test-integration:
    name: Integration Tests
    needs: [test-unit]
    if: |
      github.event_name == 'workflow_dispatch' && inputs.run-integration == true ||
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - name: Run integration tests
        working-directory: .
        env:
          REDIS_URL: redis://localhost:6379
        run: npm test --workspace=@myco/api-server -- --testPathPattern="integration"

  # ---------- Stage 5: Security scan (only on PRs from same repo, not forks) ----------
  security-scan:
    name: Security Scan
    needs: [build]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - name: Audit dependencies
        working-directory: .
        run: npm audit --audit-level=high
      - name: Publish results
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "Would publish security results"

  # ---------- Final gate ----------
  ci-success:
    name: CI Success
    needs: [build, lint, test-unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test-unit.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"
